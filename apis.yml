aid: novi
name: Novi
description: 'Novi Connect is an AI shopping optimization platform for consumer packaged
  goods (CPG) and retail brands. Its AI Shopping Optimizer structures and optimizes
  product data feeds so that AI systems, agentic search, and commerce assistants can
  accurately understand, trust, and recommend products, while its Product Authority
  Builder verifies and distributes product data through direct feeds with major retailers
  and marketplaces. Novi Connect is backed by Cowboy Ventures and Greylock.'
